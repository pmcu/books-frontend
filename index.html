<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books Database</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f5f5f5;
    }

    .book-card {
      transition: transform 0.2s ease;
    }

    .book-card:hover {
      transform: scale(1.02);
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Keady Books</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Books</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="history.html">History</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- MAIN CONTAINER -->
<div class="container mt-5">

  <h1 class="mb-4 text-center">Books about Keady</h1>

  <img src="markethouse.png" class="img-fluid mx-auto d-block" style="height:200px;" alt="">

  <hr>

  <!-- BOOK SELECTOR -->
  <div class="mb-3">
    <label class="form-label">Select Book</label>
    <select id="bookSelect" class="form-select">
      <option value="">Choose a book...</option>
    </select>
  </div>

  <!-- SEARCH + FILTER -->
  <div class="row mb-4">

    <div class="col-md-6 mb-2">
      <input
        type="text"
        id="searchInput"
        class="form-control"
        placeholder="Search by title or author"
      >
    </div>

    <div class="col-md-6 mb-2">
      <select id="tagFilter" class="form-select">
        <option value="all">All Tags</option>
      </select>
    </div>

  </div>

  <!-- OUTPUT -->
  <div id="output" class="row"></div>

</div>

<script>
  let allBooks = [];

  const output = document.getElementById("output");
  const searchInput = document.getElementById("searchInput");
  const tagFilter = document.getElementById("tagFilter");
  const bookSelect = document.getElementById("bookSelect");

  // ---------------------------
  // LOAD BOOK LIST
  // ---------------------------
  async function loadBookList() {
  try {
    console.log("Loading books.json...");

    const response = await fetch("data/books.json");

    console.log("Response status:", response.status);

    if (!response.ok) {
      throw new Error("books.json not found");
    }

    const books = await response.json();

    console.log("Books loaded:", books);

    books.forEach(book => {
      const option = document.createElement("option");
      option.value = book.file;
      option.textContent = book.title;
      bookSelect.appendChild(option);
    });

  } catch (err) {
    console.error("Book list error:", err);
  }
}

  loadBookList();

  // ---------------------------
  // SELECT BOOK
  // ---------------------------
  bookSelect.addEventListener("change", (e) => {
    if (!e.target.value) return;
    loadSelectedBook(e.target.value);
  });

  async function loadSelectedBook(file) {
    try {
      output.innerHTML = `
        <div class="col-12">
          <div class="alert alert-info">Loading book...</div>
        </div>
      `;

      const response = await fetch(`data/${file}`);
      allBooks = await response.json();

      populateTagFilter(allBooks);
      renderBooks(allBooks);

    } catch (error) {
      console.error(error);

      output.innerHTML = `
        <div class="col-12">
          <div class="alert alert-danger">
            Could not load book file.
          </div>
        </div>
      `;
    }
  }

  // ---------------------------
  // FILTER TAGS
  // ---------------------------
  function populateTagFilter(books) {
    const tags = [...new Set(books.map(book => book.tag))];

    tagFilter.innerHTML = '<option value="all">All Tags</option>';

    tags.forEach(tag => {
      const option = document.createElement("option");
      option.value = tag;
      option.textContent = tag;
      tagFilter.appendChild(option);
    });
  }

  // ---------------------------
  // SEARCH + FILTER
  // ---------------------------
  searchInput.addEventListener("input", filterBooks);
  tagFilter.addEventListener("change", filterBooks);

  function filterBooks() {
    const searchTerm = searchInput.value.toLowerCase();
    const selectedTag = tagFilter.value;

    const filteredBooks = allBooks.filter(book => {
      const matchesSearch =
        book.title.toLowerCase().includes(searchTerm) ||
        book.author.toLowerCase().includes(searchTerm);

      const matchesTag =
        selectedTag === "all" || book.tag === selectedTag;

      return matchesSearch && matchesTag;
    });

    renderBooks(filteredBooks);
  }

  // ---------------------------
  // RENDER
  // ---------------------------
  function renderBooks(books) {
    output.innerHTML = "";

    if (books.length === 0) {
      output.innerHTML = `
        <div class="col-12">
          <div class="alert alert-warning">
            No books found.
          </div>
        </div>
      `;
      return;
    }

    books.forEach(book => {
      output.innerHTML += `
        <div class="col-md-6 col-lg-4 mb-4">
          <div class="card shadow-sm h-100 book-card">
            <div class="card-body">

              <h4 class="card-title">${book.title}</h4>

              <p class="card-text">
                <strong>Author:</strong> ${book.author}
              </p>

              <p class="card-text">
                <strong>Tag:</strong>
                <span class="badge bg-secondary">${book.tag}</span>
              </p>

              <p class="card-text">
                <strong>Content:</strong><br>
                ${book.content || "No content available"}
              </p>

              <p class="card-text mb-1">
                <strong>Notes:</strong>
              </p>

              <div class="border rounded p-2 bg-light">
                ${book.notes || "No notes available"}
              </div>

            </div>
          </div>
        </div>
      `;
    });
  }
</script>

</body>
</html>
