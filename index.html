<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books Database</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f5f5f5;
    }

    .book-card {
      transition: transform 0.2s ease;
    }

    .book-card:hover {
      transform: scale(1.02);
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <img src="markethouse.png" alt="markethouse" height="200">
    <h1 class="mb-4 text-center">Books about Keady</h1>

    <div class="row mb-4">
      <div class="col-md-4 mb-2">
        <button id="loadBooks" class="btn btn-primary w-100">
          Load Books
        </button>
      </div>

      <div class="col-md-4 mb-2">
        <input
          type="text"
          id="searchInput"
          class="form-control"
          placeholder="Search by title or author"
        >
      </div>

      <div class="col-md-4 mb-2">
        <select id="tagFilter" class="form-select">
          <option value="all">All Tags</option>
        </select>
      </div>
    </div>

    <div id="output" class="row"></div>
  </div>

  <script>
    const API_URL = "https://books-api-production-61c4.up.railway.app/books";

    let allBooks = [];

    const loadBooksButton = document.getElementById("loadBooks");
    const output = document.getElementById("output");
    const searchInput = document.getElementById("searchInput");
    const tagFilter = document.getElementById("tagFilter");

    loadBooksButton.addEventListener("click", loadBooks);
    searchInput.addEventListener("input", filterBooks);
    tagFilter.addEventListener("change", filterBooks);

    async function loadBooks() {
      try {
        output.innerHTML = `
          <div class="col-12">
            <div class="alert alert-info">Loading books...</div>
          </div>
        `;

        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error("Failed to fetch books");
        }

        allBooks = await response.json();

        populateTagFilter(allBooks);
        renderBooks(allBooks);

      } catch (error) {
        console.error(error);

        output.innerHTML = `
          <div class="col-12">
            <div class="alert alert-danger">
              Could not load books.
            </div>
          </div>
        `;
      }
    }

    function populateTagFilter(books) {
      const tags = [...new Set(books.map(book => book.tag))];

      tagFilter.innerHTML = '<option value="all">All Tags</option>';

      tags.forEach(tag => {
        const option = document.createElement("option");
        option.value = tag;
        option.textContent = tag;
        tagFilter.appendChild(option);
      });
    }

    function filterBooks() {
      const searchTerm = searchInput.value.toLowerCase();
      const selectedTag = tagFilter.value;

      const filteredBooks = allBooks.filter(book => {
        const matchesSearch =
          book.title.toLowerCase().includes(searchTerm) ||
          book.author.toLowerCase().includes(searchTerm);

        const matchesTag =
          selectedTag === "all" || book.tag === selectedTag;

        return matchesSearch && matchesTag;
      });

      renderBooks(filteredBooks);
    }

    function renderBooks(books) {
      output.innerHTML = "";

      if (books.length === 0) {
        output.innerHTML = `
          <div class="col-12">
            <div class="alert alert-warning">
              No books found.
            </div>
          </div>
        `;
        return;
      }

      books.forEach(book => {
        output.innerHTML += `
          <div class="col-md-6 col-lg-4 mb-4">
            <div class="card shadow-sm h-100 book-card">
              <div class="card-body">
                <h4 class="card-title">${book.title}</h4>
                <p class="card-text">
                  <strong>Author:</strong> ${book.author}
                </p>
                <p class="card-text">
                  <strong>Tag:</strong>
                  <span class="badge bg-secondary">${book.tag}</span>
                </p>

                <p class="card-text">
                  <strong>Content:</strong><br>
                  ${book.content || "No content available"}
                </p>

                <p class="card-text mb-1">
                  <strong>Notes:</strong>
                </p>

                <div class="border rounded p-2 bg-light">
                  ${book.notes || "No notes available"}
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }
  </script>

</body>
</html>
