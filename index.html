<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books Database</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f5f5f5;
    }

    .book-card {
      transition: transform 0.2s ease;
    }

    .book-card:hover {
      transform: scale(1.02);
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Keady Books</a>
<div class="mb-3">
  <label class="form-label">Select Book</label>
  <select id="bookSelect" class="form-select">
    <option value="">Choose a book...</option>
  </select>
</div>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="index.html">Books</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="about.html">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="history.html">History</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="contact.html">Contact</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
  <div class="container mt-5">
    
    <h1 class="mb-4 text-center">Books about Keady</h1>
    <img src="markethouse.png" class="img-fluid mx-auto d-block" style="height:200px;" alt="...">
<hr>
    <div class="row mb-4">
      <div class="col-md-4 mb-2">
     
      </div>

      <div class="col-md-4 mb-2">
        <input
          type="text"
          id="searchInput"
          class="form-control"
          placeholder="Search by title or author"
        >
      </div>

      <div class="col-md-4 mb-2">
        <select id="tagFilter" class="form-select">
          <option value="all">All Tags</option>
        </select>
      </div>
    </div>

    <div id="output" class="row"></div>
  </div>

  <script>
   

    let allBooks = [];

async function loadSelectedBook(file) {
  try {
    output.innerHTML = `
      <div class="col-12">
        <div class="alert alert-info">Loading book...</div>
      </div>
    `;

    const response = await fetch(`data/${file}`);
    allBooks = await response.json();

    populateTagFilter(allBooks);
    renderBooks(allBooks);

  } catch (error) {
    console.error(error);

    output.innerHTML = `
      <div class="col-12">
        <div class="alert alert-danger">
          Could not load book file.
        </div>
      </div>
    `;
  async function loadBookList() {
    const response = await fetch("data/books.json");
    const books = await response.json();

    const select = document.getElementById("bookSelect");

    books.forEach(book => {
      const option = document.createElement("option");
      option.value = book.file;
      option.textContent = book.title;
      select.appendChild(option);
  });
}

loadBookList();
    document.getElementById("bookSelect").addEventListener("change", (e) => {
  if (!e.target.value) return;
  loadSelectedBook(e.target.value);
});
  }
}
    
</body>
</html>
