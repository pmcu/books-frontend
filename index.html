<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bunachar Leabhar</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    button {
      padding: 10px 15px;
      margin-right: 10px;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .book {
      border: 1px solid #ccc;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 6px;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
    }

    .meta {
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Books Database</h1>

  <button onclick="loadBooks()">Na Leabhair</button>

  <div id="books-container"></div>

  <script>
    async function loadBooks() {
      try {
        const response = await fetch("http://localhost:3000/books");
        const books = await response.json();

        const container = document.getElementById("books-container");
        container.innerHTML = "";

        books.forEach(book => {
          const div = document.createElement("div");
          div.className = "book";

          div.innerHTML = `
            <div class="title">${book.title}</div>
            <div class="meta">Author: ${book.author}</div>
            <div class="meta">Tag: ${book.tag}</div>
            <div class="meta">Year: ${book.year}</div>
          `;

          container.appendChild(div);
        });
      } catch (error) {
        console.error(error);
        alert("Could not load books");
      }
    }
  </script>
</body>
</html>
