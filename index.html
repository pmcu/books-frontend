<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bunachar Leabhar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


</head>
<body>
  <div class="container mt-4>
  <h1 class="mb-4">Bunachar Leabhar</h1>

  <button id="loadBooks" onclick="loadBooks()" class="btn btn-primary mb-3">Na Leabhair</button>

  <div id="output"></div>
  </div>
  <script>
    async function loadBooks() {
      try {
        
        const response = await fetch("https://books-api-production-61c4.up.railway.app/books");
        const books = await response.json();

        const container = document.getElementById("books-container");
        container.innerHTML = "";

        books.forEach(book => {
          const div = document.createElement("div");
          div.className = "book";

          div.innerHTML = `
            <div class="title">${book.title}</div>
            <div class="meta">Author: ${book.author}</div>
            <div class="meta">Tag: ${book.tag}</div>
            <div class="meta">Year: ${book.year}</div>
          `;

          container.appendChild(div);
        });
      } catch (error) {
        console.error(error);
        alert("Could not load books");
      }
    }
  </script>
</body>
</html>
