<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Test</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">Books Test Page</h1>

    <div class="mb-3">
        <label class="form-label">Select Record</label>

        <select id="bookSelect" class="form-select">
            <option value="">Choose a record...</option>
        </select>
    </div>

    <div id="output"></div>

</div>

<script>

let books = [];

const bookSelect = document.getElementById("bookSelect");
const output = document.getElementById("output");


// -------------------------
// Load books.json
// -------------------------
async function loadBooks() {

    try {

        const response = await fetch("./data/books.json");

        if (!response.ok) {
            throw new Error("Could not load books.json");
        }

        books = await response.json();

        console.log("Loaded books:", books);

        books.forEach(book => {

            const option = document.createElement("option");

            option.value = book.id;
            option.textContent = `${book.id} - ${book.title}`;

            bookSelect.appendChild(option);

        });

    }

    catch(error) {

        console.error(error);

        output.innerHTML = `
            <div class="alert alert-danger">
                Failed to load books.json
            </div>
        `;

    }

}


// -------------------------
// Display selected record
// -------------------------
async function displayRecord(id) {

    const book = books.find(b => String(b.id) === String(id));

    if (!book) return;

    console.log("Selected book:", book);

    let content = "";

    try {

        const url = `./data/${book.file}`;

        console.log("Fetching:", url);

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error(`Could not load file: ${book.file}`);
        }

        const data = await response.json();

        // If your file is a JSON object with "content"
        content = data.content || JSON.stringify(data, null, 2);

    }

    catch(error) {

        console.error(error);

        content = `ERROR loading ${book.file}`;

    }

    output.innerHTML = `

        <div class="card shadow-sm">

            <div class="card-body">

                <h3>${book.title}</h3>

                <p><strong>Author:</strong> ${book.author}</p>
                <p><strong>Tag:</strong> ${book.tag}</p>
                <p><strong>Year:</strong> ${book.year}</p>

                <p><strong>File:</strong> ${book.file}</p>

                <hr>

                <h5>Content</h5>

                <pre style="white-space: pre-wrap;">${content}</pre>

                <hr>

                <h5>Notes</h5>
                <p>${book.notes || ""}</p>

            </div>

        </div>

    `;

}


// -------------------------
// Events
// -------------------------
bookSelect.addEventListener("change", (e) => {

    if (!e.target.value) return;

    displayRecord(e.target.value);

});


// -------------------------
// Init
// -------------------------
loadBooks();

</script>

</body>
</html>
