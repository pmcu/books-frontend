<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Book File Test</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h1>Book File Test</h1>

    <select id="bookSelect" class="form-select mb-3">
        <option value="">Choose a record...</option>
    </select>

    <div id="bookInfo"></div>

</div>

<script>

let books = [];

const bookSelect = document.getElementById("bookSelect");
const bookInfo = document.getElementById("bookInfo");


// Load books.json
async function loadBooks() {

    const response = await fetch("data/books.json");

    books = await response.json();

    books.forEach(book => {

        const option = document.createElement("option");

        option.value = book.id;
        option.textContent = `${book.id} - ${book.title}`;

        bookSelect.appendChild(option);

    });
}


// Load text file
async function displayBook(id) {

    const book = books.find(b => b.id === id);

    if (!book) return;

    let content = "";

    try {

        const response = await fetch(`data/${book.content_file}`);

        content = await response.text();

    }
    catch(err) {

        content = "Could not load text file.";

    }

    bookInfo.innerHTML = `

        <div class="card">

            <div class="card-body">

                <h3>${book.title}</h3>

                <p><strong>Author:</strong> ${book.author}</p>

                <p><strong>Tag:</strong> ${book.tag}</p>

                <hr>

                <pre>${content}</pre>

                <hr>

                <p>${book.notes}</p>

            </div>

        </div>

    `;
}


bookSelect.addEventListener("change", e => {

    displayBook(e.target.value);

});

loadBooks();

</script>

</body>
</html>
