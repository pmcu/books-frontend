<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Test</title>

```
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
```

</head>
<body>

<div class="container mt-5">

```
<h1 class="mb-4">Books Test Page</h1>

<div class="mb-4">
    <label class="form-label">Select Record</label>

    <select id="bookSelect" class="form-select">
        <option value="">Choose a record...</option>
    </select>
</div>

<div id="output"></div>
```

</div>

<script>

let books = [];

const bookSelect = document.getElementById("bookSelect");
const output = document.getElementById("output");


// ----------------------
// Load books.json
// ----------------------

async function loadBooks() {

    try {

        const response = await fetch("data/books.json");

        books = await response.json();

        books.forEach(book => {

            const option = document.createElement("option");

            option.value = book.id;

            option.textContent =
                `${book.id} - ${book.title}`;

            bookSelect.appendChild(option);

        });

        console.log("Loaded", books.length, "records");

    }

    catch(error) {

        output.innerHTML = `
            <div class="alert alert-danger">
                Could not load books.json
            </div>
        `;

        console.error(error);

    }

}


// ----------------------
// Display record
// ----------------------

async function displayRecord(id) {

    const book =
        books.find(b => String(b.id) === String(id));

    if (!book) return;

    let content = "";

    try {

        const response =
            await fetch(`data/${book.content_file}`);

        if (!response.ok) {

            throw new Error("Text file not found");

        }

        content = await response.text();

    }

    catch(error) {

        content =
            `ERROR: Could not load ${book.content_file}`;

        console.error(error);

    }

    output.innerHTML = `

        <div class="card">

            <div class="card-body">

                <h3>${book.title}</h3>

                <p>
                    <strong>Author:</strong>
                    ${book.author}
                </p>

                <p>
                    <strong>Tag:</strong>
                    ${book.tag}
                </p>

                <p>
                    <strong>Year:</strong>
                    ${book.year}
                </p>

                <p>
                    <strong>Text File:</strong>
                    ${book.content_file}
                </p>

                <hr>

                <pre style="white-space: pre-wrap;">
${content}
                </pre>

```
            <hr>

            <p>
                <strong>Notes:</strong>
                ${book.notes || ""}
            </p>

        </div>

    </div>

`;
```

}

// ----------------------
// Events
// ----------------------

bookSelect.addEventListener("change", e => {

```
if (!e.target.value) return;

displayRecord(e.target.value);
```

});

// ----------------------
// Start
// ----------------------

loadBooks();

</script>

</body>
</html>
