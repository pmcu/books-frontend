<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Test</title>

```
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
```

</head>
<body>

<div class="container mt-5">

```
<h1 class="mb-4">Books Test Page</h1>

<div class="mb-3">
    <label class="form-label">Select Record</label>

    <select id="bookSelect" class="form-select">
        <option value="">Choose a record...</option>
    </select>
</div>

<div id="output"></div>
```

</div>

<script>

let books = [];

const bookSelect = document.getElementById("bookSelect");
const output = document.getElementById("output");


// -------------------------
// Load books.json
// -------------------------
async function loadBooks() {

    try {

        const response = await fetch("data/books.json");

        books = await response.json();

        console.log("Books loaded:", books);

        books.forEach(book => {

            const option = document.createElement("option");

            option.value = book.id;

            option.textContent =
                `${book.id} - ${book.title}`;

            bookSelect.appendChild(option);

        });

    }

    catch(error) {

        console.error(error);

        output.innerHTML = `
            <div class="alert alert-danger">
                Could not load books.json
            </div>
        `;

    }

}


// -------------------------
// Display selected record
// -------------------------
async function displayRecord(id) {

    const book =
        books.find(b => String(b.id) === String(id));

    if (!book) return;

    console.log("Selected record:", book);

    let contentText = "";

    try {

        console.log("Loading:", book.content);

        const response =
            await fetch(`data/${book.content}`);

        if (!response.ok) {

            throw new Error(
                `File not found: ${book.content}`
            );

        }

        contentText = await response.text();

    }

    catch(error) {

        console.error(error);

        contentText =
            `ERROR: Could not load ${book.content}`;

    }

    output.innerHTML = `

        <div class="card shadow-sm">

            <div class="card-body">

                <h3>${book.title}</h3>

                <p>
                    <strong>Author:</strong>
                    ${book.author}
                </p>

                <p>
                    <strong>Tag:</strong>
                    ${book.tag}
                </p>

                <p>
                    <strong>Year:</strong>
                    ${book.year}
                </p>

                <p>
                    <strong>Text File:</strong>
                    ${book.content}
                </p>

                <hr>

                <h5>Content</h5>

                <pre style="
                    white-space: pre-wrap;
                    font-family: inherit;
                ">${contentText}</pre>

```
            <hr>

            <h5>Notes</h5>

            <p>${book.notes || ""}</p>

        </div>

    </div>

`;
```

}

// -------------------------
// Dropdown event
// -------------------------
bookSelect.addEventListener(
"change",
function(event) {

```
    const id = event.target.value;

    if (!id) return;

    displayRecord(id);

}
```

);

// -------------------------
// Start app
// -------------------------
loadBooks();

</script>

</body>
</html>
